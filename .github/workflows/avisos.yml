name: Avisos diarios

# Cada mañana, cuando el radar ya ha recogido y leído las convocatorias del
# día (su Action empieza a las 05:30 UTC y tarda como mucho unos 40 minutos),
# se ejecuta la pasada de avisos: la aplicación Spring Boot arranca, reparte
# las ayudas nuevas, manda los correos y termina. Sin servidor encendido.
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: avisos

jobs:
  avisos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: sh mvnw -B -q package -DskipTests
      - name: Pasada de avisos
        env:
          # La misma cadena de conexión de Neon que usan las funciones de Vercel
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTAS_WEB: https://alertas.felixcorcoran.es
          ALERTAS_API: https://alertas.felixcorcoran.es
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RESEND_API_KEY" ]; then
            echo "Faltan los secretos DATABASE_URL o RESEND_API_KEY: no hay nada que hacer"
            exit 0
          fi
          # postgresql://usuario:clave@servidor/base → lo que pide Spring (JDBC)
          eval "$(python3 - <<'PY'
          import os, shlex
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ['DATABASE_URL'])
          valores = {
              'SPRING_DATASOURCE_URL': f'jdbc:postgresql://{u.hostname}{u.path}?sslmode=require',
              'SPRING_DATASOURCE_USERNAME': unquote(u.username or ''),
              'SPRING_DATASOURCE_PASSWORD': unquote(u.password or ''),
          }
          print(f"echo ::add-mask::{shlex.quote(valores['SPRING_DATASOURCE_PASSWORD'])}")
          for clave, valor in valores.items():
              print(f'export {clave}={shlex.quote(valor)}')
          PY
          )"
          java -jar target/alertas-*.jar --alertas.pasada=true --spring.main.web-application-type=none
