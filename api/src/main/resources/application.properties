spring.application.name=alertas

# Render dice el puerto en PORT
server.port=${PORT:8080}

# Base de datos: SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD en producción.
# En local, TestAlertasApplication levanta un PostgreSQL con Testcontainers.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Poca memoria en el plan gratuito: pocos hilos y pocas conexiones
server.tomcat.threads.max=20
spring.datasource.hikari.maximum-pool-size=4

management.endpoints.web.exposure.include=health

alertas.web=${ALERTAS_WEB:http://localhost:4200}
alertas.api=${ALERTAS_API:http://localhost:8080}
alertas.radar=https://subvenciones.felixcorcoran.es
alertas.fuente=https://raw.githubusercontent.com/felixcorcoran/subvenciones/main/datos/convocatorias.json
alertas.origenes=${ALERTAS_ORIGENES:http://localhost:4200}
alertas.clave-avisos=${ALERTAS_CLAVE_AVISOS:}
alertas.remitente=${ALERTAS_REMITENTE:Radar de subvenciones <avisos@felixcorcoran.es>}
alertas.resend-clave=${RESEND_API_KEY:}
alertas.max-correos-dia=90
