# La API en Render (plan gratuito, Fráncfort). Las claves se ponen en el panel
# de Render, no aquí.
services:
  - type: web
    name: alertas-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTAS_CLAVE_AVISOS
        sync: false
      - key: ALERTAS_WEB
        value: https://alertas.felixcorcoran.es
      - key: ALERTAS_API
        value: https://alertas.felixcorcoran.es
      - key: ALERTAS_ORIGENES
        value: https://alertas.felixcorcoran.es
